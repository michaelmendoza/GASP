<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#374151"/>
    </marker>
    <linearGradient id="inputGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="phiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#6D28D9;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="regGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="outputGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="desiredGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EC4899;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#DB2777;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="320" fill="#F9FAFB"/>

  <!-- Title -->
  <text x="450" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#111827" text-anchor="middle">GASP Framework Pipeline</text>

  <!-- Input Block -->
  <g transform="translate(30, 80)">
    <rect x="0" y="0" width="120" height="100" rx="8" fill="url(#inputGrad)" stroke="#1E40AF" stroke-width="2"/>
    <text x="60" y="35" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Input Data</text>
    <text x="60" y="55" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle" opacity="0.9">I [H, W, PCs×TRs]</text>
    <!-- Mini grid representing image -->
    <g transform="translate(35, 62)">
      <rect x="0" y="0" width="12" height="12" fill="white" opacity="0.3"/>
      <rect x="14" y="0" width="12" height="12" fill="white" opacity="0.5"/>
      <rect x="28" y="0" width="12" height="12" fill="white" opacity="0.4"/>
      <rect x="0" y="14" width="12" height="12" fill="white" opacity="0.6"/>
      <rect x="14" y="14" width="12" height="12" fill="white" opacity="0.3"/>
      <rect x="28" y="14" width="12" height="12" fill="white" opacity="0.5"/>
    </g>
  </g>

  <!-- Arrow 1 -->
  <line x1="155" y1="130" x2="195" y2="130" stroke="#374151" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="175" y="120" font-family="Arial, sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">flatten</text>

  <!-- Phi Matrix Block -->
  <g transform="translate(200, 70)">
    <rect x="0" y="0" width="160" height="120" rx="8" fill="url(#phiGrad)" stroke="#5B21B6" stroke-width="2"/>
    <text x="80" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Design Matrix</text>
    <text x="80" y="45" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" font-style="italic">Φ</text>
    <!-- Matrix visualization -->
    <g transform="translate(25, 55)">
      <rect x="0" y="0" width="110" height="55" fill="white" opacity="0.15" rx="3"/>
      <text x="8" y="15" font-family="monospace" font-size="9" fill="white" opacity="0.9">1  x₁  x₂  x₁²...</text>
      <text x="8" y="28" font-family="monospace" font-size="9" fill="white" opacity="0.9">1  x₁  x₂  x₁²...</text>
      <text x="8" y="41" font-family="monospace" font-size="9" fill="white" opacity="0.9">⋮   ⋮   ⋮   ⋮</text>
      <text x="8" y="52" font-family="monospace" font-size="9" fill="white" opacity="0.9">1  x₁  x₂  x₁²...</text>
    </g>
  </g>

  <!-- Arrow 2 -->
  <line x1="365" y1="130" x2="405" y2="130" stroke="#374151" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Regression Block -->
  <g transform="translate(410, 70)">
    <rect x="0" y="0" width="160" height="120" rx="8" fill="url(#regGrad)" stroke="#047857" stroke-width="2"/>
    <text x="80" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Regression</text>
    <!-- Equation -->
    <text x="80" y="55" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">min ‖Φ·A - D‖²</text>
    <text x="80" y="75" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle" opacity="0.9">+ λ‖A‖² (optional)</text>
    <!-- Coefficient vector -->
    <g transform="translate(55, 85)">
      <text x="0" y="12" font-family="Arial, sans-serif" font-size="11" fill="white">A = </text>
      <rect x="20" y="0" width="30" height="25" fill="white" opacity="0.2" rx="2"/>
      <text x="35" y="17" font-family="monospace" font-size="10" fill="white" text-anchor="middle">aₙ</text>
    </g>
  </g>

  <!-- Arrow 3 -->
  <line x1="575" y1="130" x2="615" y2="130" stroke="#374151" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="595" y="120" font-family="Arial, sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">Φ·A</text>

  <!-- Output Block -->
  <g transform="translate(620, 80)">
    <rect x="0" y="0" width="130" height="100" rx="8" fill="url(#outputGrad)" stroke="#B45309" stroke-width="2"/>
    <text x="65" y="30" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Spectral</text>
    <text x="65" y="48" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Output</text>
    <!-- Output image -->
    <g transform="translate(35, 55)">
      <rect x="0" y="0" width="55" height="35" fill="white" opacity="0.3" rx="3"/>
      <!-- Gradient representation -->
      <rect x="5" y="5" width="10" height="25" fill="white" opacity="0.4"/>
      <rect x="18" y="5" width="10" height="25" fill="white" opacity="0.7"/>
      <rect x="31" y="5" width="10" height="25" fill="white" opacity="0.5"/>
    </g>
  </g>

  <!-- Desired Profile (D) - coming from below -->
  <g transform="translate(440, 220)">
    <rect x="0" y="0" width="100" height="70" rx="8" fill="url(#desiredGrad)" stroke="#BE185D" stroke-width="2"/>
    <text x="50" y="22" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Desired</text>
    <text x="50" y="38" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Profile D</text>
    <!-- Spectral curve -->
    <path d="M 15 60 Q 30 45, 50 45 Q 70 45, 85 60" stroke="white" stroke-width="2" fill="none" opacity="0.8"/>
  </g>

  <!-- Arrow from D to Regression -->
  <line x1="490" y1="218" x2="490" y2="195" stroke="#374151" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Method label -->
  <g transform="translate(760, 100)">
    <rect x="0" y="0" width="120" height="80" rx="6" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="60" y="20" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#4B5563" text-anchor="middle">Methods:</text>
    <text x="60" y="38" font-family="monospace" font-size="10" fill="#6B7280" text-anchor="middle">linear</text>
    <text x="60" y="52" font-family="monospace" font-size="10" fill="#6B7280" text-anchor="middle">affine</text>
    <text x="60" y="66" font-family="monospace" font-size="10" fill="#6B7280" text-anchor="middle">quad / quad-cross</text>
  </g>

  <!-- Dashed line connecting method to Phi -->
  <line x1="760" y1="140" x2="365" y2="140" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="4,2"/>

</svg>
